[project]
name = "securo-telegram-rag"
version = "0.1.0"
description = "MCP server exposing RAG search over a Telegram group to securo's agents"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-jose>=3.3",
    "fastembed>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
